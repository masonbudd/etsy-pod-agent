[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etsy-pod-agent"
version = "0.1.0"
description = "Claude Code skills and a Python pipeline that turn print-on-demand wall-art designs into checked Etsy draft listings."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
podagent = "podagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the full demo"]
